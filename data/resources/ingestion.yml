resources:
  pipelines:
    credit_pipeline:
      name: credit_pipeline
      catalog: main
      target: ${resources.schemas.credit.name}
      serverless: true
      libraries:
        - file: {path: ../src/ingestion/credit_pipeline.sql}

  jobs:
    ingestion:
      name: credit_ingestion
      trigger:
        file_arrival:
          url: /Volumes/main/credit/landing/
          wait_after_last_change_seconds: 60
      tasks:
        - task_key: credit_pipeline
          pipeline_task: {pipeline_id: "${resources.pipelines.credit_pipeline.id}"}
