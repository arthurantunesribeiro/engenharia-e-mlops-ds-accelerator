# Mede drift e qualidade da entrada quando o modelo pontua (endpoint ou batch).
resources:
  jobs:
    monitoring:
      name: credit_monitoring
      trigger:
        table_update:
          table_names: [main.credit_ml.scores_credito, main.credit_ml.credit_score_payload]
          condition: ANY_UPDATED
          min_time_between_triggers_seconds: 3600
      environments:
        - environment_key: default
          spec: ${var.job_environment}
      tasks:
        - task_key: build_inference_log
          environment_key: default
          spark_python_task: {python_file: ../src/monitoring/build_inference_log.py}
        - task_key: monitor_model
          depends_on: [{task_key: build_inference_log}]
          environment_key: default
          spark_python_task: {python_file: ../src/monitoring/monitor_model.py}
