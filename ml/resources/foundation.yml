# Onde o modelo e o que ele produz moram, e o anomaly detection do Databricks sobre o schema.
resources:
  schemas:
    credit_ml:
      catalog_name: main
      name: credit_ml
      comment: "Features, scores, quarentena, monitoramento e o modelo"
      lifecycle: {prevent_destroy: true}

  experiments:
    credit_score_experiment:
      name: /Users/${workspace.current_user.userName}/credit_score

  registered_models:
    credit_score:
      catalog_name: main
      schema_name: ${resources.schemas.credit_ml.name}
      name: credit_score
      comment: "Score de inadimplência 90d: contrato de entrada, score, faixa e motivos"
      lifecycle: {prevent_destroy: true}

  data_quality_monitors:
    credit_ml_anomaly_detection:
      object_type: schema
      object_id: ${resources.schemas.credit_ml.schema_id}
      # sem notificação: o anomaly detection não aceita destino de e-mail, só Slack, Teams, webhook e
      # afins, ou usuários do workspace (destination_user_ids)
      anomaly_detection_config: {}
