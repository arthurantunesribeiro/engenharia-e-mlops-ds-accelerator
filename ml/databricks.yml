bundle:
  name: credit_ml
  engine: direct

include:
  - resources/*.yml

artifacts:
  credit_score:
    type: whl
    path: .
    build: uv build --wheel
    dynamic_version: true

variables:
  catalog:
    description: Catálogo do Unity Catalog onde ficam os schemas do projeto
    default: workspace
  team_group:
    description: Grupo do Unity Catalog com acesso aos schemas do projeto (quem faz o deploy é o service principal)
    default: account users
  warehouse_id:
    description: SQL warehouse que roda os SQL alerts
    lookup: {warehouse: Serverless Starter Warehouse}
  job_environment:
    description: Ambiente serverless das tarefas dos jobs, com o pacote e as versões fixas
    type: complex
    default:
      environment_version: "4"
      dependencies:
        - ./dist/*.whl
        - mlflow==3.17.2
        - databricks-sdk==0.155.0
        - matplotlib==3.10.0

python:
  venv_path: .venv
  resources:
    - "resources.serving:load_resources"
    - "resources.monitoring:load_resources"
    - "resources.inference_profile:load_resources"
    - "resources.model_alerts:load_resources"
  mutators:
    - "resources.notifications:failure_email"

# jobs, pipeline, experimento, endpoint e dashboard: quem é do workspace pode ver, rodar e aprovar
permissions:
  - level: CAN_MANAGE
    group_name: users

targets:
  dev:
    default: true
