name: ml-ci

on:
  pull_request:
    paths: ["ml/**", "ruff.toml", ".github/workflows/ml-*.yml"]
  push:
    branches: [main]
    paths: ["ml/**", "ruff.toml", ".github/workflows/ml-*.yml"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ml}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.13.6", python-version: "3.12", enable-cache: true, cache-dependency-glob: ml/uv.lock}
      - run: uv sync --locked --no-group bundle
      - run: uv run --no-sync ruff format --check . && uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q

  model-environment:
    needs: tests
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ml}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.13.6", python-version: "3.12", enable-cache: true, cache-dependency-glob: ml/uv.lock}
      - run: uv sync --locked --no-group bundle
      - run: uv run --no-sync pytest -q -m environment -o addopts=""
