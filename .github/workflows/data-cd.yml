# Time de dados: publica o bundle data/ a cada push na main que muda algo em data/.
name: data-cd

on:
  push:
    branches: [main]
    paths: ["data/**", ".github/workflows/data-cd.yml"]

concurrency: data-cd

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: databricks
    defaults: {run: {working-directory: data}}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy
