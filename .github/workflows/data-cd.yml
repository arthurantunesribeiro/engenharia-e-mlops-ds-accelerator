name: data-cd

on:
  push:
    branches: [main]
    paths: ["data/**", "ruff.toml", ".github/workflows/data-cd.yml"]
  workflow_dispatch:

concurrency: data-cd

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: databricks
    defaults: {run: {working-directory: data}}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pipx run ruff==0.17.6 format --check . && pipx run ruff==0.17.6 check .
      - uses: databricks/setup-cli@v1.24.0
      - run: databricks bundle deploy
